name: ch_print
description: "Application de génération rapide d'étiquettes de numéros de châssis."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter

  # Génération et gestion PDF
  pdf: ^3.10.4
  printing: ^5.11.1
  
  # Base de données locale (Historique)
  sqflite: ^2.3.0
  path_provider: ^2.1.1
  
  # Gestion d'état
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  
  # Formatage (Dates pour l'historique)
  intl: ^0.18.1

  # Icônes modernes
  cupertino_icons: ^1.0.6

  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg