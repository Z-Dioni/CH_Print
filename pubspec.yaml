name: ch_print
description: "Application de génération rapide d'étiquettes de numéros de châssis."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.2.0+7

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter

  # Génération et gestion PDF
  pdf: ^3.10.4
  printing: ^5.11.1
  
  # Base de données locale (Historique)
  sqflite: ^2.3.0
  path_provider: ^2.1.1
  
  # Gestion d'état
  flutter_bloc: ^8.1.3
  provider: ^6.1.2
  equatable: ^2.0.5
  
  # Formatage (Dates pour l'historique)
  intl: ^0.18.1

  # Icônes modernes
  cupertino_icons: ^1.0.6

  url_launcher: ^6.3.0
  shared_preferences: ^2.5.5

  flutter_launcher_icons: ^0.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/ch_print_icon.png
    - assets/NotoSansSymbols2-Regular.ttf
    - assets/Arial_Black.ttf
    - assets/NotoSansDisplay-Bold.ttf
    - assets/DejaVuSans-Bold.ttf
    - assets/FreeSans.ttf
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

flutter_icons:
  android: true
  ios: false
  image_path: "assets/ch_print_icon.png"
  adaptive_icon_background: "#1565C0" # Couleur de fond bleu professionnel de l'UI
  adaptive_icon_foreground: "assets/ch_print_icon.png"